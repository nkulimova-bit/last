<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оқу жоспары — Студенттің электрондық органайзері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme-init.js"></script>
</head>
<body data-page="study" data-title="Оқу жоспары">
<main id="content">
<div class="page-head"><div><h2>Оқу жоспары</h2><p>Мақсат қойып, оқу сессияларын жоспарлаңыз</p></div><button type="button" class="btn btn-primary" id="addGoal"><i data-lucide="plus"></i> Мақсат қосу</button></div>
<div class="stats-grid stats-3">
  <div class="card stat"><span class="ico mint"><i data-lucide="timer"></i></span><div><b id="totalTime">—</b><span>Барлық оқу уақыты</span></div></div>
  <div class="card stat"><span class="ico blue"><i data-lucide="calendar-range"></i></span><div><b id="weekTime">—</b><span>Осы апта</span></div></div>
  <div class="card stat"><span class="ico orange"><i data-lucide="target"></i></span><div><b id="goalCount">0</b><span>Мақсаттар</span></div></div>
</div>
<section class="card" style="margin:var(--sp-5) 0"><div class="card-head"><h2>Осы аптадағы оқу уақыты (минут)</h2></div><div class="chart-box" style="height:220px"><canvas id="weekChart"></canvas></div></section>
<div id="goals"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.452.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/forms.js"></script>
<script src="js/study-planner.js"></script>
</body>
</html>
