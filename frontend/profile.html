<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — Студенттің электрондық органайзері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme-init.js"></script>
</head>
<body data-page="profile" data-title="Профиль">
<main id="content">
<div class="page-head"><div><h2>Профиль</h2><p>Жеке деректер және қауіпсіздік</p></div></div>
<div class="grid-2" style="margin-top:0">
  <section class="card"><div class="card-head"><h2>Жеке мәліметтер</h2></div>
    <form id="profileForm" novalidate>
      <label class="field"><span>Аты-жөні</span><input type="text" id="fullName" maxlength="100" required></label>
      <label class="field"><span>Email (өзгертілмейді)</span><input type="email" id="email" readonly></label>
      <p class="muted small">Тіркелген күні: <span id="since"></span></p>
      <div class="form-error" id="profileErr" hidden></div>
      <button type="submit" class="btn btn-primary" style="margin-top:12px">Сақтау</button>
    </form></section>
  <section class="card"><div class="card-head"><h2>Құпиясөзді өзгерту</h2></div>
    <form id="pwForm" novalidate>
      <label class="field"><span>Ағымдағы құпиясөз</span><input type="password" name="current_password" autocomplete="current-password"></label>
      <label class="field"><span>Жаңа құпиясөз (кемінде 8 таңба, әріп пен сан)</span><input type="password" name="new_password" autocomplete="new-password"></label>
      <label class="field"><span>Жаңа құпиясөзді қайталаңыз</span><input type="password" name="confirm_password" autocomplete="new-password"></label>
      <div class="form-error" id="pwErr" hidden></div>
      <button type="submit" class="btn btn-mint" style="margin-top:12px">Құпиясөзді өзгерту</button>
    </form></section>
</div>
<section class="card" style="margin-top:var(--sp-5)"><button type="button" class="btn btn-danger" id="logoutBtn2"><i data-lucide="log-out"></i> Жүйеден шығу</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.452.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
