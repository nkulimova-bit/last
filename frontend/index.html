<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Басты бет — Студенттің электрондық органайзері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/theme-init.js"></script>
</head>
<body data-page="index" data-title="Басты бет">
<main id="content">

<section class="card welcome" id="welcome"></section>
<section class="quick" aria-label="Жылдам әрекеттер">
  <button type="button" class="btn btn-primary" id="qTask"><i data-lucide="list-plus"></i> Тапсырма қосу</button>
  <button type="button" class="btn btn-mint" id="qClass"><i data-lucide="calendar-plus"></i> Сабақ қосу</button>
  <button type="button" class="btn btn-orange" id="qNote"><i data-lucide="notebook-pen"></i> Жазба қосу</button>
  <button type="button" class="btn btn-ghost" id="qExam"><i data-lucide="graduation-cap"></i> Емтихан қосу</button>
</section>
<section class="stats-grid" id="stats" aria-label="Тапсырма статистикасы"></section>
<div class="grid-2">
  <section class="card"><div class="card-head"><h2>Бүгінгі сабақтар</h2><a class="btn btn-ghost btn-sm" href="timetable.html">Кесте</a></div><div class="stack" id="todayList"></div></section>
  <section class="card"><div class="card-head"><h2>Академиялық прогресс</h2></div>
    <div class="progress-wrap"><div class="donut"><canvas id="donut" aria-label="Тапсырмалардың орындалу пайызы"></canvas><div class="center"><b id="donutPct">0%</b><span>орындалды</span></div></div><div class="metrics" id="metrics"></div></div></section>
</div>
<div class="grid-2">
  <section class="card"><div class="card-head"><h2>Жақын мерзімдер</h2><a class="btn btn-ghost btn-sm" href="tasks.html">Барлығы</a></div><div class="stack" id="deadlines"></div></section>
  <section class="card"><div class="card-head"><h2>Алдағы емтихандар</h2><a class="btn btn-ghost btn-sm" href="exams.html">Барлығы</a></div><div class="stack" id="examList"></div></section>
</div>
<section class="card" style="margin-top:var(--sp-5)"><div class="card-head"><h2>Апталық кесте</h2></div><div class="week-grid" id="weekGrid"></div></section>

</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.452.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/forms.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
