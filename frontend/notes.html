<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жазбалар — Студенттің электрондық органайзері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<body data-page="notes" data-title="Жазбалар">
<main id="content">
<div class="page-head"><div><h2>Жазбалар</h2><p>Конспектілер мен маңызды ойларыңыз</p></div><button type="button" class="btn btn-primary" id="addBtn"><i data-lucide="plus"></i> Жазба қосу</button></div>
<div class="toolbar">
  <div class="search grow"><i data-lucide="search"></i><input type="search" id="q" placeholder="Жазбалардан іздеу…" aria-label="Іздеу"></div>
  <select id="fSubject" aria-label="Пән бойынша"></select>
  <select id="fSort" aria-label="Сұрыптау"><option value="created_desc">Жаңадан ескіге</option><option value="created_asc">Ескіден жаңаға</option><option value="updated_desc">Соңғы өзгертілген</option></select>
</div>
<div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.452.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
